const CODE="<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Crystal Dent: анализ, спрос и точки роста<\/title>\n\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap\">\n<style>\n/* Layout: одна колонка «листов»; цифры крупно, графики на всю ширину листа */\n:root{\n  --bg:#F3F6F7; --paper:#FFFFFF; --ink:#13242D; --muted:#5B6C74; --line:#DCE4E7;\n  --enamel:#0B7A84; --enamel-soft:#D5ECEE; --loss:#C8513B; --loss-soft:#F6DDD7;\n  --ok:#2F8A57; --warn:#B9820F; --grey:#A9B6BC; --violet:#6B5BA8; --tip-bg:#13242D; --tip-fg:#F3F6F7;\n  --f-display:\"Unbounded\",\"Arial Black\",system-ui,sans-serif;\n  --f-body:\"Onest\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --f-mono:\"JetBrains Mono\",ui-monospace,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0E181D; --paper:#15232A; --ink:#E4ECEF; --muted:#93A5AD; --line:#26363E;\n  --enamel:#3FB8C2; --enamel-soft:#173A40; --loss:#EC7A62; --loss-soft:#3E2520;\n  --ok:#5CC18A; --warn:#E0AE45; --grey:#4E6069; --violet:#A497E0; --tip-bg:#E4ECEF; --tip-fg:#0E181D; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0E181D; --paper:#15232A; --ink:#E4ECEF; --muted:#93A5AD; --line:#26363E;\n  --enamel:#3FB8C2; --enamel-soft:#173A40; --loss:#EC7A62; --loss-soft:#3E2520;\n  --ok:#5CC18A; --warn:#E0AE45; --grey:#4E6069; --violet:#A497E0; --tip-bg:#E4ECEF; --tip-fg:#0E181D; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}\n.wrap{max-width:1080px;margin:0 auto;display:grid;gap:28px}\nh1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}\nh1{font-size:clamp(24px,4.4vw,40px);line-height:1.12}\nh2{font-size:clamp(18px,2.6vw,24px);line-height:1.2}\nh3{font-family:var(--f-body);font-weight:600;font-size:15px}\np{margin:0}\n.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.muted{color:var(--muted)}\n.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px);display:grid;gap:22px;min-width:0}\n.sheet-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}\n.sheet-head .no{font-family:var(--f-mono);font-size:13px;color:var(--enamel);border:1px solid var(--enamel);border-radius:999px;padding:1px 9px}\n.sub{font-size:13px;color:var(--muted)}\n.hero{display:grid;gap:18px;padding-block:8px}\n.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}\n.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}\n.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}\n.kpi b{font-family:var(--f-display);font-size:clamp(22px,2.8vw,28px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}\n.kpi span{font-size:13px;color:var(--muted)}\n.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.fact{border:1px solid var(--line);border-top:3px solid var(--loss);background:var(--paper);border-radius:0 0 12px 12px;padding:14px 14px 16px;display:grid;gap:6px;align-content:start}\n.fact.good{border-top-color:var(--ok)}\n.fact .big{font-family:var(--f-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}\n.fact .line{font-weight:600}\n.fact .note{font-size:13px;color:var(--muted)}\n.chart{width:100%;min-width:0}\n.chart svg{display:block;width:100%;height:auto;overflow:visible}\n.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}\n.chart .lbl{fill:var(--ink);font-family:var(--f-body);font-size:12px}\n.chart .grid{stroke:var(--line);stroke-width:1}\n.chart .zero{stroke:var(--muted);stroke-width:1}\n.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}\n.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}\n.cell{display:grid;gap:10px;align-content:start;min-width:0}\n#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:8px;max-width:280px;box-shadow:0 6px 20px rgb(0 0 0 / .18)}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}\n.seg button{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:0;padding:6px 12px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--enamel);color:var(--paper)}\n.seg button:focus-visible,th button:focus-visible{outline:2px solid var(--enamel);outline-offset:2px}\n.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:560px;overflow-y:auto}\ntable{border-collapse:collapse;width:100%;font-size:13px}\n#tbl{min-width:860px}\nth,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--paper)}\nth{font-weight:600;color:var(--muted);background:var(--paper);position:sticky;top:0;z-index:1}\nth:first-child{z-index:2}\nth button{all:unset;cursor:pointer}\nth button::after{content:\" ↕\";opacity:.4}\ntd.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}\ntd.weak{color:var(--loss);font-weight:600}\ntd.na{color:var(--grey)}\ntr.me td,tr.me td:first-child{background:var(--enamel-soft);font-weight:600}\n.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}\n.pill.ok{color:var(--ok)} .pill.bad{color:var(--loss)} .pill.warn{color:var(--warn)} .pill.na{color:var(--grey)} .pill.me{color:var(--enamel)}\n.state{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n.st{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start}\n.st b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}\n.st span{font-size:13px;color:var(--muted)}\n.heat{overflow-x:auto}\n.heat table{min-width:620px}\n.heat td.h{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;border:2px solid var(--paper);border-radius:6px}\n.heat th{text-align:center}\n.bar-in{display:inline-block;height:8px;border-radius:4px;background:var(--enamel);vertical-align:middle;margin-left:8px}\n.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.nw{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}\n.nw .big{font-family:var(--f-display);font-size:22px;line-height:1.15;color:var(--enamel)}\n.nw a{color:var(--muted);font-size:12.5px;word-break:break-word}\n.nw .idea{font-size:13.5px}\n.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.step{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}\n.step .when{font-family:var(--f-mono);font-size:12px;color:var(--enamel);text-transform:uppercase;letter-spacing:.06em}\n.step ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}\n.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\nfooter{font-size:12.5px;color:var(--muted);display:grid;gap:10px}\nfooter ul{margin:0;padding-left:18px;display:grid;gap:3px}\nfooter a{color:var(--muted);word-break:break-word}\na{color:var(--enamel)}\nsup{font-size:10px;color:var(--warn)}\n@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child{grid-column:1/-1}.facts,.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}.state{grid-template-columns:repeat(2,minmax(0,1fr))}.route{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.chart{overflow-x:auto}.chart svg{min-width:540px}}\n@media (max-width:640px){.two,.news,.facts,.cards3,.route{grid-template-columns:minmax(0,1fr)}}\n.chart [data-tip]:hover{opacity:.78}\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n\n<header class=\"hero\">\n  <div class=\"eyebrow\">Стоматология · Краснодар · Агрономическая, 2/5<\/div>\n  <h1>Crystal Dent: анализ, спрос и точки роста<\/h1>\n  <div class=\"meta\"><span>Яндекс Бизнес: октябрь 2025 — сентябрь 2026<\/span><span>Вордстат: октябрь 2024 — сентябрь 2026<\/span><span>Отчёты клиники: апрель — 20 октября 2026<\/span><\/div>\n  <div class=\"kpis\" id=\"kpis\"><\/div>\n<\/header>\n\n<section class=\"sheet\" aria-labelledby=\"s0\">\n  <div class=\"sheet-head\"><h2 id=\"s0\">Главное за 30 секунд<\/h2><\/div>\n  <div class=\"facts\" id=\"facts\"><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s1\">\n  <div class=\"sheet-head\"><span class=\"no\">1<\/span><h2 id=\"s1\">Куда приходит трафик<\/h2><span class=\"sub\">Яндекс Бизнес, карточка Crystal Dent<\/span><\/div>\n  <div class=\"cell\">\n    <h3>Переходы в карточку, октябрь 2025 — сентябрь 2026<\/h3>\n    <div class=\"legend\"><span><i style=\"background:var(--enamel)\"><\/i>дискавери (нашли по категории)<\/span><span><i style=\"background:var(--grey)\"><\/i>прямые (искали Crystal Dent)<\/span><\/div>\n    <div class=\"chart\" id=\"c-tr\"><\/div>\n  <\/div>\n  <div class=\"two\">\n    <div class=\"cell\"><h3>Переходы по месяцам, два года<\/h3><div class=\"chart\" id=\"c-tr24\"><\/div><\/div>\n    <div class=\"cell\"><h3>Целевые действия по месяцам<sup>1<\/sup><\/h3><div class=\"legend\"><span><i style=\"background:var(--enamel)\"><\/i>звонки<\/span><span><i style=\"background:var(--warn)\"><\/i>маршруты<\/span><span><i style=\"background:var(--violet)\"><\/i>сайт<\/span><\/div><div class=\"chart\" id=\"c-act\"><\/div><\/div>\n  <\/div>\n  <div class=\"cell\">\n    <h3>Первичные звонки в клинику по итогу, апрель — 20 октября 2026<\/h3>\n    <div class=\"legend\"><span><i style=\"background:var(--ok)\"><\/i>пришли на приём<\/span><span><i style=\"background:var(--warn)\"><\/i>записались, не пришли<\/span><span><i style=\"background:var(--loss)\"><\/i>не записались<\/span><\/div>\n    <div class=\"chart\" id=\"c-calls\"><\/div>\n  <\/div>\n  <p class=\"sub\"><sup>1<\/sup> Действия кабинет отдаёт за январь — июнь 2025 и июль — сентябрь 2026; за июль 2025 — июнь 2026 данных нет. Конверсия считается только по месяцам, где есть оба показателя. Источник звонков: CRM клиники.<\/p>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s2\">\n  <div class=\"sheet-head\"><span class=\"no\">2<\/span><h2 id=\"s2\">Сравнение с конкурентами<\/h2><span class=\"sub\">блок «Конкуренты» Яндекс Бизнеса, неделя 28.09 — 04.10.2026<\/span><\/div>\n  <div class=\"tools\">\n    <div class=\"seg\" role=\"group\" aria-label=\"Фильтр по статусу\" id=\"flt\">\n      <button type=\"button\" id=\"f-all\" data-f=\"all\" aria-pressed=\"true\">Все<\/button>\n      <button type=\"button\" id=\"f-pr\" data-f=\"pr\" aria-pressed=\"false\">С продвижением<\/button>\n      <button type=\"button\" id=\"f-nopr\" data-f=\"nopr\" aria-pressed=\"false\">Без продвижения<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tbl\"><table id=\"tbl\"><thead><\/thead><tbody><\/tbody><\/table><\/div>\n  <p class=\"sub\">Публикации, сторис, переходы, звонки, маршруты, сайт и конверсия известны только по Crystal Dent — блок «Состояние карточки».<\/p>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s3\">\n  <div class=\"sheet-head\"><span class=\"no\">3<\/span><h2 id=\"s3\">Состояние карточки<\/h2><span class=\"sub\">Яндекс Бизнес и Яндекс Карты, 21.10.2026<\/span><\/div>\n  <div class=\"state\" id=\"state\"><\/div>\n  <div class=\"cell\"><h3>Новые отзывы на Яндексе по месяцам<\/h3><div class=\"chart\" id=\"c-revm\"><\/div><p class=\"sub\">По 150 из 177 отзывов, которые отдаёт публичная карточка.<\/p><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s4\">\n  <div class=\"sheet-head\"><span class=\"no\">4<\/span><h2 id=\"s4\">Конкуренты<\/h2><span class=\"sub\">зона 5 км, 120 похожих клиник<\/span><\/div>\n  <div class=\"two\">\n    <div class=\"cell\"><h3>Доля переходов в зоне, топ-10<\/h3><div class=\"chart\" id=\"c-share\"><\/div><\/div>\n    <div class=\"cell\"><h3>Дискавери-переходы за неделю<\/h3><div class=\"chart\" id=\"c-disc\"><\/div><\/div>\n  <\/div>\n  <div class=\"cell\"><h3>Crystal Dent, медиана конкурентов и лидер зоны<\/h3><div class=\"legend\"><span><i style=\"background:var(--enamel)\"><\/i>Crystal Dent<\/span><span><i style=\"background:var(--grey)\"><\/i>медиана 39 конкурентов<\/span><span><i style=\"background:var(--warn)\"><\/i>лидер — «Феи улыбки»<\/span><\/div><div class=\"chart\" id=\"c-med\"><\/div><\/div>\n  <div class=\"cell\"><h3>Брендовый спрос, Краснодар, октябрь 2025 — сентябрь 2026<\/h3><div class=\"chart\" id=\"c-brand\"><\/div><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s5\">\n  <div class=\"sheet-head\"><span class=\"no\">5<\/span><h2 id=\"s5\">Как клиенты находят клинику<\/h2><\/div>\n  <div class=\"two\">\n    <div class=\"cell\"><h3>Как пришли в карточку, последние визиты<\/h3><div class=\"chart\" id=\"c-geo\"><\/div><p class=\"sub\" id=\"geo-note\"><\/p><\/div>\n    <div class=\"cell\"><h3>Брендовый спрос: Crystal Dent и лидер зоны<\/h3><div class=\"legend\"><span><i style=\"background:var(--enamel)\"><\/i>Crystal Dent, все написания<\/span><span><i style=\"background:var(--warn)\"><\/i>«Феи улыбки»<\/span><\/div><div class=\"chart\" id=\"c-bl\"><\/div><\/div>\n  <\/div>\n  <div class=\"cell\"><h3>Звонки с Яндекса: что видит Яндекс и что записано в CRM<\/h3><div class=\"legend\"><span><i style=\"background:var(--ok)\"><\/i>принятые звонки по рекламному номеру Яндекса<\/span><span><i style=\"background:var(--loss)\"><\/i>пропущенные<\/span><span><i style=\"background:var(--enamel)\"><\/i>в CRM на «Яндекс Карты, Google Maps»<\/span><\/div><div class=\"chart\" id=\"c-ct\"><\/div><p class=\"sub\">Яндекс считает все звонки, CRM — первичные. Разбивка CRM по каналам есть только за сентябрь.<\/p><\/div>\n  <div class=\"two\">\n    <div class=\"cell\"><h3>Откуда пришли записавшиеся, июль — 20 октября<\/h3><div class=\"chart\" id=\"c-grp\"><\/div><\/div>\n    <div class=\"cell\"><h3>Звонки на рекламные номера, сентябрь<\/h3><div class=\"legend\"><span><i style=\"background:var(--grey)\"><\/i>звонки<\/span><span><i style=\"background:var(--warn)\"><\/i>записи<\/span><span><i style=\"background:var(--ok)\"><\/i>пришли<\/span><\/div><div class=\"chart\" id=\"c-sep\"><\/div><\/div>\n  <\/div>\n  <div class=\"cell\"><h3>Источники записей по месяцам<\/h3><div class=\"heat\" id=\"heat\"><\/div><\/div>\n  <div class=\"cell\"><h3>Ценность источника, июль — 20 октября<\/h3><div class=\"tbl\"><table id=\"srct\" style=\"min-width:620px\"><thead><\/thead><tbody><\/tbody><\/table><\/div><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s6\">\n  <div class=\"sheet-head\"><span class=\"no\">6<\/span><h2 id=\"s6\">Спрос на рынке<\/h2><span class=\"sub\">Вордстат<\/span><\/div>\n  <div class=\"cell\"><h3>«стоматология» по месяцам<\/h3><div class=\"legend\"><span><i style=\"background:var(--enamel)\"><\/i>Краснодар<\/span><span><i style=\"background:var(--grey)\"><\/i>Краснодарский край<\/span><\/div><div class=\"chart\" id=\"c-mkt\"><\/div><\/div>\n  <div class=\"cell\"><h3>Что растёт и что падает, Краснодар: 12 месяцев к предыдущим 12<\/h3><div class=\"chart\" id=\"c-div\"><\/div><p class=\"sub\"><sup>*<\/sup> в базе прошлого года разовый всплеск запросов, падение завышено.<\/p><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s7\">\n  <div class=\"sheet-head\"><span class=\"no\">7<\/span><h2 id=\"s7\">Сезонность<\/h2><span class=\"sub\">Вордстат, Краснодар, октябрь 2025 — сентябрь 2026<\/span><\/div>\n  <div class=\"heat\" id=\"heat-s\"><\/div>\n  <div class=\"cards3\" id=\"season\"><\/div>\n  <div class=\"cell\"><h3>Сезонность самой клиники: первичные звонки и выручка<\/h3><div class=\"heat\" id=\"heat2\"><\/div><\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s8\">\n  <div class=\"sheet-head\"><span class=\"no\">8<\/span><h2 id=\"s8\">Новые правила и поводы для контента<\/h2><span class=\"sub\">2026<\/span><\/div>\n  <div class=\"news\">\n    <div class=\"nw\"><div class=\"eyebrow\">с 1 сентября 2026<\/div><div class=\"big\">Договор онлайн<\/div><p>Новые правила платных медуслуг (постановление № 659): договор можно заключить на сайте, в приложении или в мессенджере «Макс», вход через Госуслуги.<\/p><p class=\"idea\"><b>Повод:<\/b> «Запишитесь и оформите договор, не выходя из дома».<\/p><a href=\"https://rg.ru/2026/06/17/v-rossii-s-1-sentiabria-zarabotaiut-novye-pravila-predostavleniia-platnyh-meduslug.html\" target=\"_blank\" rel=\"noopener\">Российская газета, 17.06.2026<\/a><\/div>\n    <div class=\"nw\"><div class=\"eyebrow\">с 1 сентября 2026<\/div><div class=\"big\">Приблизительная смета<\/div><p>В правилах появилась «приблизительная смета». Если лечение нужно расширить, пациента предупреждают сразу.<\/p><p class=\"idea\"><b>Повод:<\/b> «Смета до начала лечения» — ответ на страх переплатить при имплантации.<\/p><a href=\"https://rg.ru/2026/06/17/v-rossii-s-1-sentiabria-zarabotaiut-novye-pravila-predostavleniia-platnyh-meduslug.html\" target=\"_blank\" rel=\"noopener\">Российская газета, 17.06.2026<\/a><\/div>\n    <div class=\"nw\"><div class=\"eyebrow\">налоговый вычет<\/div><div class=\"big\">до 19 500 ₽ назад<\/div><p>Лимит социальных вычетов — 150 000 ₽ в год, возврат 13 %. По новым правилам клиника по заявлению выдаёт документы для вычета. <span id=\"ded\"><\/span><\/p><p class=\"idea\"><b>Повод:<\/b> декабрь — «успейте пролечиться в этом году», январь — март — «верните 13 % за лечение».<\/p><a href=\"https://t-j.ru/guide/vychet-za-zuby/\" target=\"_blank\" rel=\"noopener\">Т—Ж: вычет за лечение зубов<\/a><\/div>\n    <div class=\"nw\"><div class=\"eyebrow\">с 1 сентября 2026<\/div><div class=\"big\">Новый СанПиН<\/div><p>СП 2.1.4284-26 заменил СП 2.1.3678-20. Требования к стерилизации почти не изменились, акцент проверок — медотходы и документы.<\/p><p class=\"idea\"><b>Повод:<\/b> «Как мы стерилизуем инструменты» — сторис и пост из кабинета стерилизации.<\/p><a href=\"https://stomatologclub.ru/stati/marketing-i-menedzhment-396/novyj-sanpin-s-1-sentyabrya-2026-goda-chto-izmenitsya-dlya-stomatologicheskih-klinik-4800/\" target=\"_blank\" rel=\"noopener\">Клуб стоматологов<\/a><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sheet\" aria-labelledby=\"s9\">\n  <div class=\"sheet-head\"><span class=\"no\">9<\/span><h2 id=\"s9\">Маршрут роста<\/h2><\/div>\n  <div class=\"route\" id=\"route\"><\/div>\n<\/section>\n\n<footer>\n  <div class=\"eyebrow\">Источники и ограничения<\/div>\n  <ul>\n    <li>Яндекс Бизнес, кабинет Crystal Dent (permalink 209317787662), выгрузка 21.10.2026. Кабинет в режиме ограниченной функциональности. Статистика переходов и действий обработана до 06.10.2026; переходы — октябрь 2024 — сентябрь 2026; действия — январь — июнь 2025 и июль — сентябрь 2026.<\/li>\n    <li>Блок «Конкуренты»: неделя 28.09 — 04.10.2026, обработано 07.10.2026, радиус 5 км. Геовизор: последние 50 визитов, 17 — 19.10.2026. Звонки по рекламному номеру Яндекса: август — 21 октября 2026.<\/li>\n    <li>Вордстат: октябрь 2024 — сентябрь 2026, все устройства, регионы «Краснодар» и «Краснодарский край», широкое соответствие. Брендовый спрос — сумма написаний crystal dent, кристал дент, кристалл дент, cristal dent.<\/li>\n    <li>Отчёт клиники «Рекламные каналы» (звонки на рекламные номера), апрель — 20.10.2026; разбивка по каналам есть только за сентябрь. Отчёт «Источники» (опрос записавшихся), апрель — 20.10.2026; разбивка — июль — октябрь.<\/li>\n    <li>Публичные данные 21.10.2026: <a href=\"https://yandex.ru/maps/org/crystal_dent/209317787662/\" target=\"_blank\" rel=\"noopener\">карточка на Яндекс Картах<\/a>, <a href=\"https://crystaldent.pro\" target=\"_blank\" rel=\"noopener\">crystaldent.pro<\/a>, <a href=\"https://prodoctorov.ru/krasnodar/lpu/76914-kristal-dent/\" target=\"_blank\" rel=\"noopener\">ПроДокторов<\/a> (4,8, 227 отзывов), <a href=\"https://vk.ru/crystaldentkrd\" target=\"_blank\" rel=\"noopener\">ВКонтакте<\/a> (80 подписчиков). 2ГИС не открылся без входа.<\/li>\n    <li>Отзывы по месяцам — по 150 из 177 отзывов публичной карточки; дата последнего отзыва сверена в кабинете.<\/li>\n  <\/ul>\n<\/footer>\n<\/div>\n<div id=\"tip\" hidden><\/div>\n\n<script>\nconst DATA={\"r1\": {\"calls\": [20, 42, 33, 53, 48, 52, 22], \"neg\": [0, 0, 1, 2, 0, 1, 0], \"booked\": [12, 24, 17, 27, 32, 28, 15], \"came\": [9, 18, 14, 20, 26, 18, 8], \"rev1\": [11970, 87120, 72345, 58030, 148625, 56690, 14840], \"ltv\": [18845, 452028, 133026, 137932, 348821, 192056, 36970]}, \"sep\": [[\"Не определён\", 18, 8, 6, 34230, 77540], [\"2ГИС\", 18, 9, 6, 9480, 9481], [\"ПроДокторов\", 7, 6, 5, 7980, 100035], [\"Яндекс Карты + Google Maps\", 6, 2, 0, 0, 0], [\"Улица / вывеска\", 3, 3, 1, 5000, 5000], [\"WhatsApp\", 0, 0, 0, 0, 0]], \"src\": {\"Июл\": {\"Неизвестно\": [14, 8, 29940, 83191], \"Сотрудники\": [7, 3, 8915, 84675], \"Семья\": [12, 10, 44371, 148229], \"Пациенты\": [10, 8, 42790, 68230], \"Баннер\": [3, 2, 7980, 7981], \"Вывеска\": [4, 4, 6500, 62490], \"Яндекс Карты\": [2, 2, 10000, 15000], \"2ГИС\": [5, 5, 21320, 31960
