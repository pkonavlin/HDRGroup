const order = ["maps","vk","tg","dzen"];
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

function fieldSubheadings(arr){
  if(!arr || !arr.length) return "";
  return `<div class="field">
    <div class="field-label">Подзаголовки</div>
    <ul class="sub-list">${arr.map(s=>`<li>${s}</li>`).join("")}</ul>
  </div>`;
}

function themeCard(t, isStory, hasFormatNote){
  return `<div class="theme-card">
    <div class="theme-title">${t.title}</div>
    ${hasFormatNote ? `<div class="format-note">${t.description}</div>` : ""}
    ${fieldSubheadings(t.subheadings)}
    ${!hasFormatNote ? `<div class="field">
      <div class="field-label">Описание темы</div>
      <div class="field-body muted">${t.description}</div>
    </div>` : ""}
    <div class="field">
      <div class="field-label">Как раскрыть тему в тексте</div>
      <ul class="reveal-list">${t.reveal.map(r=>`<li>${r}</li>`).join("")}</ul>
    </div>
    <div class="field">
      <div class="field-label">SEO-ключи</div>
      <div class="tags">${t.seo.map(s=>`<span class="tag">${s}</span>`).join("")}</div>
    </div>
  </div>`;
}

order.forEach((key, i)=>{
  const p = DATA[key];

  const tabBtn = document.createElement('button');
  tabBtn.className = 'tab' + (i===0 ? ' active' : '');
  tabBtn.textContent = p.label;
  tabBtn.onclick = ()=> switchTab(key);
  tabBtn.dataset.key = key;
  tabsEl.appendChild(tabBtn);

  const panel = document.createElement('div');
  panel.className = 'platform-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + key;
  panel.innerHTML = `
    <div class="platform-note">${p.note}</div>
    <div class="columns">
      <div>
        <div class="col-title" data-toggle="news-${key}">
          <span class="dot news"></span>Темы для новостей
          <svg class="chevron" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="theme-list" id="news-${key}">
          <div class="theme-list-inner">${p.news.map(t=>themeCard(t,false,false)).join("")}</div>
        </div>
      </div>
      <div>
        <div class="col-title" data-toggle="stories-${key}">
          <span class="dot stories"></span>Темы для историй
          <svg class="chevron" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="theme-list" id="stories-${key}">
          <div class="theme-list-inner">${p.stories.map(t=>themeCard(t,true, key==='tg' || key==='dzen')).join("")}</div>
        </div>
      </div>
    </div>
  `;
  panelsEl.appendChild(panel);

  panel.querySelectorAll('.col-title').forEach(title=>{
    title.addEventListener('click', ()=>{
      const list = document.getElementById(title.dataset.toggle);
      title.classList.toggle('collapsed');
      list.classList.toggle('collapsed');
    });
  });
});

function switchTab(key){
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.platform-panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+key));
}
</script>
